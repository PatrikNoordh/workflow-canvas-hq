<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Visual reference for the Mini-ATS UI. Static prototype with mock data; nothing is saved. -->
<title>Mini-ATS Prototyp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app-skal med vänster sidomeny, header och en arbetsyta; kanban med sex smala kolumner */
:root{
  --bg:#f4f6f7; --surface:#ffffff; --sunken:#eef1f2; --line:#dde2e5; --line-strong:#c8d0d4;
  --fg:#1b2428; --muted:#5d6b72; --faint:#8a979d;
  --accent:#1f6672; --accent-fg:#ffffff; --accent-soft:#e3f0f1;
  --banner:#fff4d6; --banner-fg:#5b4500; --banner-line:#ecd38a;
  --danger:#b3402f; --ok:#2e7d4f;
  --s-new:#6b7c85; --s-screening:#3d7bb5; --s-interview:#7a5cc0; --s-offer:#c08a1e; --s-hired:#2e7d4f; --s-rejected:#b3402f;
  --shadow:0 1px 2px rgba(20,35,40,.06),0 4px 14px rgba(20,35,40,.06);
  --font:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12181b; --surface:#1a2226; --sunken:#151c1f; --line:#2a353a; --line-strong:#3a474d;
  --fg:#e3e9eb; --muted:#9aa8ae; --faint:#6f7e85;
  --accent:#5bb3bf; --accent-fg:#0d1517; --accent-soft:#1d3236;
  --banner:#3a3016; --banner-fg:#f1d98e; --banner-line:#5c4c20;
  --danger:#e07a68; --ok:#6cc08f;
  --s-new:#8d9ea6; --s-screening:#6fa6db; --s-interview:#a68be0; --s-offer:#dcae4f; --s-hired:#6cc08f; --s-rejected:#e07a68;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181b; --surface:#1a2226; --sunken:#151c1f; --line:#2a353a; --line-strong:#3a474d;
  --fg:#e3e9eb; --muted:#9aa8ae; --faint:#6f7e85;
  --accent:#5bb3bf; --accent-fg:#0d1517; --accent-soft:#1d3236;
  --banner:#3a3016; --banner-fg:#f1d98e; --banner-line:#5c4c20;
  --danger:#e07a68; --ok:#6cc08f;
  --s-new:#8d9ea6; --s-screening:#6fa6db; --s-interview:#a68be0; --s-offer:#dcae4f; --s-hired:#6cc08f; --s-rejected:#e07a68;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* Login */
.login{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-inline:16px}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px;box-shadow:var(--shadow);display:grid;gap:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.mark{width:28px;height:28px;border-radius:7px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:13px;font-weight:700}
.field{display:grid;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.input{width:100%;height:36px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);padding:0 10px}
textarea.input{height:auto;min-height:70px;padding:8px 10px;resize:vertical}
.input.err{border-color:var(--danger)}
.hint{font-size:12px;color:var(--danger)}
.btn{height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{height:28px;padding:0 10px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.demo{border-top:1px solid var(--line);padding-top:16px;display:grid;gap:8px}
.demo-title{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.demo .btn{justify-content:space-between;width:100%}
.demo .btn span:last-child{font-weight:400;color:var(--muted);font-size:12px}

/* App-skal */
.app{display:grid;grid-template-columns:216px minmax(0,1fr);height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:20px}
.nav{display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--sunken);color:var(--fg)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav svg{width:16px;height:16px;flex:none}
.side-foot{margin-top:auto;font-size:12px;color:var(--faint)}
.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.menu-btn{display:none}
.top .spacer{flex:1}
.picker{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.picker select{height:32px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);padding:0 8px;font-size:13px;max-width:200px}
.user{display:flex;align-items:center;gap:8px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--sunken);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:600}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--sunken);color:var(--muted);border:1px solid var(--line)}
.banner{flex:none;display:flex;align-items:center;gap:12px;padding:8px 20px;background:var(--banner);color:var(--banner-fg);border-bottom:1px solid var(--banner-line);font-size:13px}
.banner b{font-weight:700}
.banner .btn{margin-left:auto;background:transparent;border-color:var(--banner-line);color:var(--banner-fg)}
.content{flex:1;overflow:auto;padding-block:20px;padding-inline:20px;min-height:0}
.page-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-head h1{font-size:20px;margin:0;font-weight:700;text-wrap:balance}
.page-head .sub{color:var(--muted);font-size:13px}
.page-head .spacer{flex:1}

/* Filter */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters select,.filters .input{height:34px;width:auto}
.filters .search{min-width:0;flex:0 1 240px}
.url{font-family:var(--mono);font-size:12px;color:var(--faint);margin-left:auto;padding:4px 8px;border:1px dashed var(--line-strong);border-radius:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Kanban */
.board-wrap{overflow-x:auto;padding-bottom:8px}
.board{display:grid;grid-template-columns:repeat(6,minmax(176px,1fr));gap:10px;min-width:1100px}
.col{background:var(--sunken);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:300px}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.col-head{display:flex;align-items:center;gap:8px;padding:10px 10px 8px;font-size:12px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.count{margin-left:auto;font-family:var(--mono);color:var(--muted);font-weight:500}
.cards{display:grid;gap:6px;padding:0 6px 8px;align-content:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;cursor:grab;text-align:left;width:100%;display:grid;gap:2px}
.card:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.card.drag{opacity:.4}
.card .name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta{display:flex;gap:6px;font-size:12px;color:var(--muted);min-width:0}
.card .meta .job{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.card .days{font-family:var(--mono);font-size:11px;color:var(--faint);flex:none}
.card .days.stale{color:var(--danger)}
.col-empty{font-size:12px;color:var(--faint);text-align:center;padding:14px 6px}

/* Tabeller */
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);background:var(--surface)}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--sunken)}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.pill.open{color:var(--ok)} .pill.closed{color:var(--muted)}
.pill.admin{color:var(--accent);background:var(--accent-soft);border-color:transparent}
a.link{color:var(--accent);text-decoration:none} a.link:hover{text-decoration:underline}

.empty{background:var(--surface);border:1px dashed var(--line-strong);border-radius:8px;padding:36px 20px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty h2{margin:0;font-size:16px;color:var(--fg)}
.choose{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;width:100%;max-width:520px;margin-top:6px}
.choose button{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;text-align:left;display:grid;gap:2px}
.choose button:hover{border-color:var(--accent)}
.choose small{color:var(--muted)}

/* Sidopanel och dialog */
.scrim{position:fixed;inset:0;background:rgba(10,20,24,.35);z-index:20}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:21;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.sheet-head{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 14px;padding-top:calc(18px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font-size:18px}
.sheet-head .sub{color:var(--muted);font-size:13px}
.sheet-body{padding:16px 20px;overflow:auto;display:grid;gap:18px;align-content:start}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.sec-title{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.links{display:grid;gap:6px}
.links div{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px}
.links div span:last-child{margin-left:auto;color:var(--muted);font-size:12px}
.notes{background:var(--sunken);border-radius:6px;padding:10px 12px;font-size:13px;white-space:pre-wrap}
.ai{border:1px dashed var(--line-strong);border-radius:8px;padding:12px;display:grid;gap:6px;font-size:13px;color:var(--muted)}
.modal{position:fixed;z-index:21;top:50%;left:50%;transform:translate(-50%,-50%);width:min(460px,calc(100% - 32px));max-height:calc(100% - 40px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;display:grid;gap:14px;box-shadow:var(--shadow)}
.modal h2{margin:0;font-size:17px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:grid;gap:6px}
.checks label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--fg);font-weight:400}
.modal-foot{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;z-index:30}

@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:0;bottom:0;left:0;width:240px;z-index:22;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none}
  .menu-btn{display:inline-flex}
  .top{padding:0 12px;gap:8px}
  .picker label{display:none}
  .picker select{max-width:140px}
  .user .who{display:none}
  .content{padding-inline:16px}
  .banner{padding-inline:16px;flex-wrap:wrap}
  .url{margin-left:0;width:100%}
  .filters .search{flex:1 1 160px}
  .row2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<style>body{margin:0}</style>
</head>
<body>
<div id="root"></div>

<script>
const STAGES=[["new","Ny"],["screening","Screening"],["interview","Intervju"],["offer","Erbjudande"],["hired","Anställd"],["rejected","Avböjd"]];
const STAGE_LABEL=Object.fromEntries(STAGES);

const db={
  profiles:[
    {id:"a1",role:"admin",full_name:"Demo Admin",company_name:"Plattformen",email:"admin@demo.test",created_at:"2026-10-01"},
    {id:"c1",role:"customer",full_name:"Karin Exempel",company_name:"Nordkust Bygg AB",email:"karin@nordkust.test",created_at:"2026-10-02"},
    {id:"c2",role:"customer",full_name:"Oskar Testsson",company_name:"Studio Lumen",email:"oskar@lumen.test",created_at:"2026-10-03"},
  ],
  jobs:[
    {id:"j1",customer_id:"c1",title:"Platschef",location:"Göteborg",status:"open",description:"Leder arbetet på plats i större markprojekt."},
    {id:"j2",customer_id:"c1",title:"Anläggningsarbetare",location:"Mölndal",status:"open",description:"Mark- och VA-arbeten."},
    {id:"j3",customer_id:"c1",title:"Arbetsledare mark",location:"Kungsbacka",status:"open",description:"Arbetsledning i infrastrukturprojekt."},
    {id:"j4",customer_id:"c1",title:"Projektingenjör",location:"Borås",status:"closed",description:"Kalkyl och inköp."},
    {id:"j5",customer_id:"c2",title:"Frontendutvecklare",location:"Stockholm",status:"open",description:"React och TypeScript."},
    {id:"j6",customer_id:"c2",title:"UX-designer",location:"Distans",status:"open",description:"Användarresearch och prototyper."},
    {id:"j7",customer_id:"c2",title:"Projektledare digitalt",location:"Stockholm",status:"open",description:"Leder kundprojekt."},
  ],
  candidates:[],applications:[]
};
// Påhittade personer
const PEOPLE={
  c1:["Alva Provsson","Bertil Demosson","Cecilia Låtsas","David Fiktiv","Elin Exempelsdotter","Filip Prototyp","Greta Testberg","Hugo Mockström","Ida Påhittad","Jonny Dummy","Klara Skissén","Lars Utkast","Maja Placeholder","Nils Fejkman","Olivia Provberg"],
  c2:["Pia Testlund","Rasmus Demovik","Sara Exempelholm","Tim Fiktivsson","Ulla Låtsasberg","Viktor Mockdal","Wilma Provnäs","Axel Skissberg","Bella Utkastsson","Carl Dummylund","Disa Fejkholm","Emil Placeholm","Frida Testdal","Gustav Provik"]
};
const NOTES=["Bra intryck i telefonsamtal. Kan börja om tre månader.","Har B-körkort och maskinbevis.","Rekommenderad av tidigare kollega.","Vill arbeta hybrid två dagar i veckan.",""];
let seq=1;const id=p=>p+(seq++);
for(const cid of ["c1","c2"]){
  const jobs=db.jobs.filter(j=>j.customer_id===cid);
  PEOPLE[cid].forEach((n,i)=>{
    const slug=n.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ /g,"-");
    const c={id:id("k"),customer_id:cid,full_name:n,email:slug.split("-")[0]+"@exempel.test",phone:"070-000 00 "+String(10+i),linkedin_url:"https://www.linkedin.com/in/"+slug+"-demo",notes:NOTES[i%NOTES.length]};
    db.candidates.push(c);
    const job=jobs[i%jobs.length];
    db.applications.push({id:id("ap"),customer_id:cid,job_id:job.id,candidate_id:c.id,stage:STAGES[(i*5+1)%6][0],days:(i*7)%23+1});
    if(i%5===0){const j2=jobs[(i+1)%jobs.length];db.applications.push({id:id("ap"),customer_id:cid,job_id:j2.id,candidate_id:c.id,stage:"new",days:(i%3)+1});}
  });
}

const S={user:null,active:null,view:"pipeline",job:"",q:"",sheet:null,modal:null,menu:false,toast:""};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const me=()=>db.profiles.find(p=>p.id===S.user);
const isAdmin=()=>me()?.role==="admin";
const prof=id=>db.profiles.find(p=>p.id===id);
const jobOf=id=>db.jobs.find(j=>j.id===id);
const candOf=id=>db.candidates.find(c=>c.id===id);
const initials=n=>n.split(" ").map(x=>x[0]).slice(0,2).join("");
let toastT;
function toast(m){S.toast=m;render();clearTimeout(toastT);toastT=setTimeout(()=>{S.toast="";render()},2200)}

const ICON={
  pipeline:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="2" width="3.5" height="12" rx="1"/><rect x="6.25" y="2" width="3.5" height="8" rx="1"/><rect x="11" y="2" width="3.5" height="10" rx="1"/></svg>',
  jobs:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="4.5" width="13" height="9" rx="1.5"/><path d="M5.5 4.5V3a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v1.5"/></svg>',
  candidates:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="5.5" r="3"/><path d="M2.5 14c.6-2.8 2.8-4.3 5.5-4.3s4.9 1.5 5.5 4.3"/></svg>',
  accounts:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="5.5" cy="6" r="2.5"/><circle cx="11.5" cy="6.5" r="2"/><path d="M1 13.5c.5-2.2 2.2-3.4 4.5-3.4s4 1.2 4.5 3.4M10 10.3c2.3-.4 4.3.7 4.8 3.2"/></svg>',
};

function render(){
  const r=$("#root");
  if(!S.user){r.innerHTML=loginView();return}
  const a=isAdmin();
  const cust=S.active?prof(S.active):null;
  const views=[["pipeline","Pipeline"],["jobs","Jobb"],["candidates","Kandidater"]];
  if(a)views.push(["accounts","Konton"]);
  r.innerHTML=`
  <div class="app">
    <aside class="side ${S.menu?"open":""}">
      <div class="brand"><div class="mark">A</div>Mini-ATS</div>
      <nav class="nav">${views.map(([k,l])=>`<a href="#" data-nav="${k}" class="${S.view===k?"on":""}">${ICON[k]}${l}</a>`).join("")}</nav>
      <div class="side-foot">Prototyp med låtsasdata. Inget sparas.</div>
    </aside>
    ${S.menu?'<div class="scrim" data-act="closemenu"></div>':""}
    <div class="main">
      <header class="top">
        <button class="btn ghost small menu-btn" data-act="menu" aria-label="Meny">☰</button>
        ${a?`<div class="picker"><label for="pick">Kund</label>
          <select id="pick" data-act="pick"><option value="">Välj kund…</option>
          ${db.profiles.filter(p=>p.role==="customer").map(p=>`<option value="${p.id}" ${S.active===p.id?"selected":""}>${esc(p.company_name)}</option>`).join("")}
          </select></div>`:`<strong>${esc(cust.company_name)}</strong>`}
        <div class="spacer"></div>
        <div class="user"><span class="tag">${a?"Admin":"Kund"}</span><span class="who">${esc(me().full_name)}</span><div class="avatar">${initials(me().full_name)}</div>
          <button class="btn small" data-act="logout">Logga ut</button></div>
      </header>
      ${a&&cust?`<div class="banner">Du arbetar som <b>${esc(cust.company_name)}</b>. Allt du skapar hamnar hos kunden.<button class="btn small" data-act="leave">Lämna kundläge</button></div>`:""}
      <main class="content">${viewBody()}</main>
    </div>
  </div>
  ${S.sheet?sheetView():""}
  ${S.modal?modalView():""}
  ${S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:""}`;
  bindDnD();
}

function loginView(){
  const pick=(id,label,sub)=>`<button class="btn" data-login="${id}"><span>${label}</span><span>${sub}</span></button>`;
  return `<div class="login"><form class="login-card" data-form="login">
    <div class="brand"><div class="mark">A</div>Mini-ATS</div>
    <div><h1 style="margin:0 0 4px;font-size:20px">Logga in</h1><div style="color:var(--muted);font-size:13px">Konton skapas av en administratör.</div></div>
    <div class="field"><label for="em">E-post</label><input class="input" id="em" type="email" placeholder="namn@foretag.se"></div>
    <div class="field"><label for="pw">Lösenord</label><input class="input" id="pw" type="password"></div>
    <div id="loginerr" class="hint" hidden>Fel e-post eller lösenord.</div>
    <button class="btn primary" type="submit" style="justify-content:center">Logga in</button>
    <div class="demo"><div class="demo-title">Demo</div>
      ${pick("a1","Admin","Plattformen")}${pick("c1","Kund","Nordkust Bygg AB")}${pick("c2","Kund","Studio Lumen")}
    </div></form></div>`;
}

function viewBody(){
  if(S.view==="accounts")return accountsView();
  if(!S.active)return chooseView();
  if(S.view==="jobs")return jobsView();
  if(S.view==="candidates")return candidatesView();
  return pipelineView();
}

function chooseView(){
  return `<div class="empty"><h2>Välj en kund att arbeta som</h2>
    <div>Jobb, kandidater och pipeline visas alltid för en kund i taget.</div>
    <div class="choose">${db.profiles.filter(p=>p.role==="customer").map(p=>{
      const n=db.jobs.filter(j=>j.customer_id===p.id&&j.status==="open").length;
      return `<button data-choose="${p.id}"><strong>${esc(p.company_name)}</strong><small>${n} öppna jobb</small></button>`}).join("")}</div></div>`;
}

function pipelineView(){
  const jobs=db.jobs.filter(j=>j.customer_id===S.active);
  const q=S.q.trim().toLowerCase();
  const apps=db.applications.filter(a=>a.customer_id===S.active&&(!S.job||a.job_id===S.job)&&(!q||candOf(a.candidate_id).full_name.toLowerCase().includes(q)));
  const qs=[S.job&&"job="+S.job,q&&"q="+encodeURIComponent(S.q.trim())].filter(Boolean).join("&");
  const cols=STAGES.map(([k,l])=>{
    const list=apps.filter(a=>a.stage===k);
    return `<section class="col" data-stage="${k}">
      <div class="col-head"><span class="dot" style="background:var(--s-${k})"></span>${l}<span class="count">${list.length}</span></div>
      <div class="cards">${list.map(a=>{const c=candOf(a.candidate_id),j=jobOf(a.job_id);
        return `<button class="card" draggable="true" data-app="${a.id}"><span class="name">${esc(c.full_name)}</span>
          <span class="meta"><span class="job">${esc(j.title)}</span><span class="days ${a.days>14&&!["hired","rejected"].includes(k)?"stale":""}" title="Dagar i steget">${a.days} d</span></span></button>`}).join("")||'<div class="col-empty">Inga kandidater</div>'}</div>
    </section>`}).join("");
  return `<div class="page-head"><h1>Pipeline</h1><span class="sub">${apps.length} kort</span><div class="spacer"></div>
      <button class="btn primary" data-act="newcand">+ Ny kandidat</button></div>
    <div class="filters">
      <select id="fjob" data-act="fjob" aria-label="Filtrera på jobb"><option value="">Alla jobb</option>${jobs.map(j=>`<option value="${j.id}" ${S.job===j.id?"selected":""}>${esc(j.title)}${j.status==="closed"?" (stängt)":""}</option>`).join("")}</select>
      <input id="fq" class="input search" placeholder="Sök kandidatnamn" value="${esc(S.q)}" data-act="fq" aria-label="Sök kandidatnamn">
      ${S.job||q?'<button class="btn small ghost" data-act="clear">Rensa filter</button>':""}
      <span class="url" title="Filtren sparas i adressen">/pipeline${qs?"?"+esc(qs):""}</span>
    </div>
    ${apps.length?`<div class="board-wrap"><div class="board">${cols}</div></div>`:`<div class="empty"><h2>Inga kort matchar</h2><div>Prova ett annat jobb eller en annan sökning.</div><button class="btn" data-act="clear">Rensa filter</button></div>`}`;
}

function jobsView(){
  const jobs=db.jobs.filter(j=>j.customer_id===S.active);
  return `<div class="page-head"><h1>Jobb</h1><span class="sub">${jobs.filter(j=>j.status==="open").length} öppna</span><div class="spacer"></div><button class="btn primary" data-act="newjob">+ Nytt jobb</button></div>
  ${jobs.length?`<div class="table-wrap"><table><thead><tr><th>Titel</th><th>Ort</th><th>Status</th><th>Kandidater</th><th></th></tr></thead><tbody>
  ${jobs.map(j=>`<tr><td><strong>${esc(j.title)}</strong></td><td>${esc(j.location)}</td>
    <td><span class="pill ${j.status}">${j.status==="open"?"● Öppet":"○ Stängt"}</span></td>
    <td class="num">${db.applications.filter(a=>a.job_id===j.id).length}</td>
    <td style="text-align:right"><button class="btn small" data-toggle="${j.id}">${j.status==="open"?"Stäng":"Öppna igen"}</button></td></tr>`).join("")}
  </tbody></table></div>`:`<div class="empty"><h2>Inga jobb än</h2><div>Lägg upp det första jobbet du söker kandidater till.</div><button class="btn primary" data-act="newjob">+ Nytt jobb</button></div>`}`;
}

function candidatesView(){
  const cs=db.candidates.filter(c=>c.customer_id===S.active);
  return `<div class="page-head"><h1>Kandidater</h1><span class="sub">${cs.length} st</span><div class="spacer"></div><button class="btn primary" data-act="newcand">+ Ny kandidat</button></div>
  <div class="table-wrap"><table><thead><tr><th>Namn</th><th>E-post</th><th>LinkedIn</th><th>Jobb</th></tr></thead><tbody>
  ${cs.map(c=>{const ap=db.applications.find(a=>a.candidate_id===c.id);return `<tr><td><a href="#" class="link" data-open="${ap?ap.id:""}"><strong>${esc(c.full_name)}</strong></a></td><td>${esc(c.email)}</td>
    <td>${c.linkedin_url?`<a class="link" href="${esc(c.linkedin_url)}" target="_blank" rel="noopener">Profil ↗</a>`:"–"}</td>
    <td class="num">${db.applications.filter(a=>a.candidate_id===c.id).length}</td></tr>`}).join("")}
  </tbody></table></div>`;
}

function accountsView(){
  return `<div class="page-head"><h1>Konton</h1><span class="sub">Bara admin ser den här sidan</span><div class="spacer"></div><button class="btn primary" data-act="newacc">+ Nytt konto</button></div>
  <div class="table-wrap"><table><thead><tr><th>Namn</th><th>Företag</th><th>E-post</th><th>Roll</th><th>Skapad</th></tr></thead><tbody>
  ${db.profiles.map(p=>`<tr><td><strong>${esc(p.full_name)}</strong></td><td>${esc(p.company_name)}</td><td>${esc(p.email)}</td>
    <td><span class="pill ${p.role}">${p.role==="admin"?"Admin":"Kund"}</span></td><td class="num">${p.created_at}</td></tr>`).join("")}
  </tbody></table></div>`;
}

function sheetView(){
  const a=db.applications.find(x=>x.id===S.sheet);if(!a)return"";
  const c=candOf(a.candidate_id);
  const links=db.applications.filter(x=>x.candidate_id===c.id);
  return `<div class="scrim" data-act="closesheet"></div>
  <aside class="sheet" role="dialog" aria-label="Kandidat">
    <div class="sheet-head"><div style="flex:1;min-width:0"><h2>${esc(c.full_name)}</h2><div class="sub">${esc(jobOf(a.job_id).title)} · ${STAGE_LABEL[a.stage]} i ${a.days} dagar</div></div>
      <button class="btn small ghost" data-act="closesheet" aria-label="Stäng">✕</button></div>
    <div class="sheet-body">
      <dl class="kv"><dt>E-post</dt><dd>${esc(c.email)}</dd><dt>Telefon</dt><dd>${esc(c.phone)}</dd>
        <dt>LinkedIn</dt><dd>${c.linkedin_url?`<a class="link" href="${esc(c.linkedin_url)}" target="_blank" rel="noopener">Öppna profil ↗</a>`:"–"}</dd></dl>
      <div><div class="sec-title">Kopplad till jobb</div><div class="links">${links.map(l=>`<div><span class="dot" style="background:var(--s-${l.stage})"></span>${esc(jobOf(l.job_id).title)}<span>${STAGE_LABEL[l.stage]}</span></div>`).join("")}</div></div>
      <div><div class="sec-title">Anteckningar</div><div class="notes">${esc(c.notes)||"Inga anteckningar."}</div></div>
      <div class="ai"><strong style="color:var(--fg)">AI-bedömning av CV</strong>Kommer i version 2: ladda upp ett CV och få ett förslag med poäng 1–10, styrkor och luckor mot jobbet.<div><button class="btn small" disabled>Bedöm CV</button></div></div>
    </div>
  </aside>`;
}

function modalView(){
  const m=S.modal;const jobs=db.jobs.filter(j=>j.customer_id===S.active&&j.status==="open");
  if(m==="job")return `<div class="scrim" data-act="closemodal"></div><form class="modal" data-form="job"><h2>Nytt jobb</h2>
    <div class="field"><label for="jt">Titel</label><input class="input" id="jt" required></div>
    <div class="field"><label for="jl">Ort</label><input class="input" id="jl"></div>
    <div class="field"><label for="jd">Beskrivning</label><textarea class="input" id="jd"></textarea></div>
    <div class="modal-foot"><button type="button" class="btn" data-act="closemodal">Avbryt</button><button class="btn primary">Skapa jobb</button></div></form>`;
  if(m==="cand")return `<div class="scrim" data-act="closemodal"></div><form class="modal" data-form="cand"><h2>Ny kandidat</h2>
    <div class="field"><label for="cn">Namn</label><input class="input" id="cn" required></div>
    <div class="row2"><div class="field"><label for="ce">E-post</label><input class="input" id="ce" type="email"></div>
    <div class="field"><label for="cp">Telefon</label><input class="input" id="cp"></div></div>
    <div class="field"><label for="cl">LinkedIn</label><input class="input" id="cl" placeholder="https://www.linkedin.com/in/…"><div id="clerr" class="hint" hidden>Ange en länk till linkedin.com.</div></div>
    <div class="field"><label for="cno">Anteckningar</label><textarea class="input" id="cno"></textarea></div>
    <div class="field"><label>Koppla till jobb (startar i Ny)</label><div class="checks">${jobs.map(j=>`<label><input type="checkbox" name="cj" value="${j.id}" ${S.job===j.id?"checked":""}> ${esc(j.title)}</label>`).join("")}</div></div>
    <div class="modal-foot"><button type="button" class="btn" data-act="closemodal">Avbryt</button><button class="btn primary">Lägg till</button></div></form>`;
  if(m==="acc")return `<div class="scrim" data-act="closemodal"></div><form class="modal" data-form="acc"><h2>Nytt konto</h2>
    <div class="field"><label for="ar">Roll</label><select class="input" id="ar"><option value="customer">Kund</option><option value="admin">Admin</option></select></div>
    <div class="row2"><div class="field"><label for="an">Namn</label><input class="input" id="an" required></div>
    <div class="field"><label for="ac">Företag</label><input class="input" id="ac"></div></div>
    <div class="field"><label for="ae">E-post</label><input class="input" id="ae" type="email" required></div>
    <div class="field"><label for="ap">Tillfälligt lösenord</label><input class="input" id="ap" value="Byt-mig-123"></div>
    <div class="modal-foot"><button type="button" class="btn" data-act="closemodal">Avbryt</button><button class="btn primary">Skapa konto</button></div></form>`;
  return "";
}

// Händelser
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-login],[data-nav],[data-act],[data-choose],[data-toggle],[data-open],.card");if(!t)return;
  if(t.dataset.login){S.user=t.dataset.login;S.active=isAdmin()?null:S.user;S.view="pipeline";S.job="";S.q="";return render()}
  if(t.dataset.nav){e.preventDefault();S.view=t.dataset.nav;S.menu=false;return render()}
  if(t.dataset.choose){S.active=t.dataset.choose;S.job="";return render()}
  if(t.dataset.toggle){const j=jobOf(t.dataset.toggle);j.status=j.status==="open"?"closed":"open";return toast(j.status==="open"?"Jobbet är öppet igen":"Jobbet är stängt")}
  if(t.dataset.open!==undefined){e.preventDefault();if(t.dataset.open){S.sheet=t.dataset.open;render()}return}
  if(t.classList.contains("card")){S.sheet=t.dataset.app;return render()}
  const a=t.dataset.act;
  if(a==="logout"){S.user=null;S.sheet=null;return render()}
  if(a==="leave"){S.active=null;return render()}
  if(a==="menu"){S.menu=true;return render()}
  if(a==="closemenu"){S.menu=false;return render()}
  if(a==="closesheet"){S.sheet=null;return render()}
  if(a==="closemodal"){S.modal=null;return render()}
  if(a==="clear"){S.job="";S.q="";return render()}
  if(a==="newjob"){S.modal="job";return render()}
  if(a==="newcand"){S.modal="cand";return render()}
  if(a==="newacc"){S.modal="acc";return render()}
});
document.addEventListener("change",e=>{
  if(e.target.id==="pick"){S.active=e.target.value||null;S.job="";S.q="";render()}
  if(e.target.id==="fjob"){S.job=e.target.value;render()}
});
document.addEventListener("input",e=>{
  if(e.target.id==="fq"){S.q=e.target.value;const pos=e.target.selectionStart;render();const f=$("#fq");f.focus();f.setSelectionRange(pos,pos)}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&(S.sheet||S.modal||S.menu)){S.sheet=null;S.modal=null;S.menu=false;render()}});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target.dataset.form;const v=id=>($("#"+id)?.value||"").trim();
  if(f==="login"){$("#loginerr").hidden=false;return}
  if(f==="job"){db.jobs.push({id:id("j"),customer_id:S.active,title:v("jt"),location:v("jl"),description:v("jd"),status:"open"});S.modal=null;return toast("Jobbet är skapat")}
  if(f==="cand"){
    const li=v("cl");
    if(li&&!/^https?:\/\/([a-z]+\.)?linkedin\.com\//i.test(li)){$("#cl").classList.add("err");$("#clerr").hidden=false;return}
    const c={id:id("k"),customer_id:S.active,full_name:v("cn"),email:v("ce"),phone:v("cp"),linkedin_url:li,notes:v("cno")};
    db.candidates.push(c);
    [...document.querySelectorAll('input[name="cj"]:checked')].forEach(x=>db.applications.push({id:id("ap"),customer_id:S.active,job_id:x.value,candidate_id:c.id,stage:"new",days:0}));
    S.modal=null;return toast("Kandidaten är tillagd")}
  if(f==="acc"){db.profiles.push({id:id("p"),role:v("ar"),full_name:v("an"),company_name:v("ac"),email:v("ae"),created_at:"2026-10-06"});S.modal=null;return toast("Kontot är skapat")}
});
let dragId=null;
function bindDnD(){
  document.querySelectorAll(".card").forEach(c=>{
    c.addEventListener("dragstart",e=>{dragId=c.dataset.app;c.classList.add("drag");e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",dragId)}catch(_){}});
    c.addEventListener("dragend",()=>c.classList.remove("drag"));
  });
  document.querySelectorAll(".col").forEach(col=>{
    col.addEventListener("dragover",e=>{e.preventDefault();col.classList.add("over")});
    col.addEventListener("dragleave",()=>col.classList.remove("over"));
    col.addEventListener("drop",e=>{e.preventDefault();col.classList.remove("over");
      const a=db.applications.find(x=>x.id===dragId);
      if(a&&a.stage!==col.dataset.stage){a.stage=col.dataset.stage;a.days=0;toast(candOf(a.candidate_id).full_name+" flyttad till "+STAGE_LABEL[a.stage])}});
  });
}
render();
</script>

</body>
</html>
